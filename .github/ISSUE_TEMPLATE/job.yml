name: Job
description: A scoped piece of work, in one lane, with a done-when
title: "[job] "
labels: ["job"]
body:
  - type: input
    id: goal
    attributes:
      label: Goal
      description: One sentence; the title of the job.
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      description: One lane only; two lanes never own the same file.
      options:
        - CPU threading (draw preparation across cores)
        - Native memory (moving off the console's shared memory model)
        - Shaders to 100% (61 of 25,758 programs still refused; picture faults)
        - Upscaling (DLSS in place of the title's own temporal upscaler)
        - Ray tracing
        - Tools and harness
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: Files owned
      description: The files this job may change; "to be confirmed by the lead" when they are not yet clear.
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: Symptom or gain
      description: What is wrong today, or what the change gains, in plain words.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Run tags, figures, or the code path that shows the fault.
  - type: textarea
    id: ruled-out
    attributes:
      label: Ruled out
      description: What has already been excluded, so nobody re-tests it.
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The fixture that must fail before and pass after, and the run result where one is asked.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options:
        - S
        - M
        - L
    validations:
      required: true
